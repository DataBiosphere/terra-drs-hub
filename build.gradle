plugins {
	id 'idea'

	id 'io.spring.dependency-management' version '1.1.7' apply false
	id 'org.springframework.boot' version '3.5.8' apply false
	id 'com.diffplug.spotless' version '8.0.0' apply false
	// ^^ for some reason, can't use spotless in multiple subprojects without this ^^
	id 'com.google.cloud.tools.jib' version '3.5.3' apply false
	// ^^ see https://github.com/GoogleContainerTools/jib/blob/master/docs/faq.md#i-am-seeing-method-not-found-or-class-not-found-errors-when-building
	id 'io.freefair.lombok' version '9.2.0' apply false
	id 'org.hidetake.swagger.generator' version '2.19.2' apply false
	id 'org.sonarqube' version '7.2.2.6593' apply false
}

// Fail fast on Java 17.0.0/17.0.1: compiler bug JDK-8273408 (typeSig ERROR) with records + Immutables.
// Fixed in JDK 17.0.2. See https://bugs.openjdk.org/browse/JDK-8273408
def versionStr = Runtime.version().toString()
def parts = versionStr.split(/\./)
def feature = parts[0].replaceAll(/[^0-9].*/, '').toInteger()
def update = parts.length >= 3 ? parts[2].replaceAll(/[^0-9].*/, '').toInteger() : 0
if (feature == 17 && update < 2) {
	throw new GradleException(
		"Java 17.0." + update + " is too old. This project uses records and Immutables, which trigger " +
		"a compiler bug (typeSig ERROR) in Java 17.0.0 and 17.0.1. Please use Java 17.0.2 or later."
	)
}

repositories { mavenCentral() }

subprojects {
	group = 'bio.terra'
	version = '1.101.0-SNAPSHOT'

	ext {
		artifactGroup = "${group}.${rootProject.name}"
	}

	apply plugin: 'io.spring.dependency-management'

	dependencyManagement {
		imports {
			mavenBom(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
		}

		dependencies {
			dependency 'io.swagger.core.v3:swagger-annotations:2.2.37'
			dependency 'io.swagger.codegen.v3:swagger-codegen-cli:3.0.77'
		}
	}

	tasks.withType(org.hidetake.gradle.swagger.generator.GenerateSwaggerCode).all {
		jvmArgs = ['--add-opens=java.base/java.util=ALL-UNNAMED'] // for jvm 16+
	}
}

idea.project.jdkName = '17'
